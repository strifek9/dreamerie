# Daily Dream Recall uses the existing service, but serves built files only.
# Keep the legacy disk attached and untouched for recovery of the social prototype.
# Importing provisions paid resources. Review docs/HOSTING.md and the checkout price first.
services:
  - type: web
    name: dreamerie-playtest
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    autoDeployTrigger: off
    maintenanceMode:
      enabled: false
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/dreamerie.sqlite
    disk:
      name: dreamerie-data
      mountPath: /var/data
      sizeGB: 1
